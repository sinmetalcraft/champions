# champions を Cloud Run に Deploy する Cloud Build の設定。
#
# 3 つの Cloud Run サービスを作る。
#   - champions-server : 一般公開アプリケーション。IAP で認証する。
#   - champions-worker : server と同じイメージ。Cloud Tasks から呼ばれる払い出し worker。IAP は付けない。
#   - champions-admin  : Admin アプリケーション。IAP で認証する。
#
# 請求先アカウントは Secret Manager から取得する。事前にシークレットを作っておくこと。
#   printf 'billingAccounts/XXXXXX-XXXXXX-XXXXXX' | \
#     gcloud secrets create champions-billing-account --data-file=-
#
# 実行例:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-northeast1,_FOLDER_PARENT=organizations/1234567890,_ADMIN_EMAILS=admin@example.com
# ビルドは champions-build で実行する。Cloud Build 既定の service account は使わない。
# substitutions の値は入れ子に展開されないので、email はここで組み立てている。
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/${_BUILD_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com

substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: champions
  # ビルドを実行する service account の ID。
  _BUILD_SERVICE_ACCOUNT: champions-build
  # Cloud Run が動く service account の ID。
  # Cloud Tasks が worker を呼ぶときの OIDC トークンもこの service account で発行する。
  _APP_SERVICE_ACCOUNT: champions-app
  # イベント用フォルダを作る親リソース。organizations/{id} もしくは folders/{id}。
  _FOLDER_PARENT: ''
  # 払い出した Project に紐付ける請求先アカウントを入れた Secret Manager のシークレット名。
  # 値は "billingAccounts/XXXXXX-XXXXXX-XXXXXX" の形式で入れておく。
  _BILLING_ACCOUNT_SECRET: champions-billing-account
  _TASKS_LOCATION: asia-northeast1
  _TASKS_PROVISION_QUEUE: champions-provision
  _TASKS_SHUTDOWN_QUEUE: champions-shutdown
  # IAP を有効にした後に取得できる aud。未設定のままでも Deploy はできるが、認証は通らない。
  _IAP_AUDIENCE_SERVER: ''
  _IAP_AUDIENCE_ADMIN: ''
  # Admin アプリを使える email。カンマ区切り。空の場合は IAP の許可のみで判定する。
  _ADMIN_EMAILS: ''

# 請求先アカウントは Secret Manager から取り出して、Cloud Run の環境変数に渡す。
# Cloud Build の service account に roles/secretmanager.secretAccessor が必要。
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_BILLING_ACCOUNT_SECRET}/versions/latest
      env: BILLING_ACCOUNT

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/admin:${SHORT_SHA}

steps:
  # Cloud Run の起動時に落ちると原因が分かりにくいので、必須の substitution はここで弾く。
  - id: check-substitutions
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        if [ -z "${_FOLDER_PARENT}" ]; then
          echo "_FOLDER_PARENT is required. e.g. --substitutions=_FOLDER_PARENT=organizations/1234567890" >&2
          exit 1
        fi
        echo "substitutions look fine"

  - id: test
    name: golang:1.27
    entrypoint: go
    args: ['test', './...']
    waitFor: ['check-substitutions']

  - id: build-server
    name: gcr.io/cloud-builders/docker
    waitFor: ['test']
    args:
      - build
      - --build-arg=CMD_NAME=server
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server:${SHORT_SHA}
      - .

  - id: build-admin
    name: gcr.io/cloud-builders/docker
    waitFor: ['test']
    args:
      - build
      - --build-arg=CMD_NAME=admin
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/admin:${SHORT_SHA}
      - .

  - id: push-server
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-server']
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server:${SHORT_SHA}']

  - id: push-admin
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-admin']
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/admin:${SHORT_SHA}']

  # worker を先に Deploy して URL を確定させる。server はその URL を WORKER_BASE_URL として持つ。
  # worker は自分の URL を OIDC トークンの audience として検証するため、URL が確定してから環境変数に入れ直す。
  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    secretEnv: ['BILLING_ACCOUNT']
    waitFor: ['push-server']
    args:
      - -c
      - |
        set -eu
        DESCRIBE="gcloud run services describe champions-worker --region=${_REGION} --format=value(status.url)"
        WORKER_URL=$$($${DESCRIBE} 2>/dev/null || true)
        # 初回 Deploy では URL が未確定なので、起動できるダミーを入れておく。
        if [ -z "$${WORKER_URL}" ]; then WORKER_URL="https://champions-worker.invalid"; fi

        gcloud run deploy champions-worker \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server:${SHORT_SHA} \
          --region=${_REGION} \
          --service-account=${_APP_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com \
          --no-allow-unauthenticated \
          --timeout=1800 \
          --concurrency=20 \
          --max-instances=10 \
          --set-env-vars="^##^GOOGLE_CLOUD_PROJECT=${PROJECT_ID}##FOLDER_PARENT=${_FOLDER_PARENT}##BILLING_ACCOUNT=$$BILLING_ACCOUNT##TASKS_LOCATION=${_TASKS_LOCATION}##TASKS_PROVISION_QUEUE=${_TASKS_PROVISION_QUEUE}##TASKS_SHUTDOWN_QUEUE=${_TASKS_SHUTDOWN_QUEUE}##WORKER_INVOKER_SERVICE_ACCOUNT=${_APP_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com##IAP_AUDIENCE=${_IAP_AUDIENCE_SERVER}##WORKER_BASE_URL=$${WORKER_URL}"

        REAL_URL=$$($${DESCRIBE})
        if [ "$${REAL_URL}" != "$${WORKER_URL}" ]; then
          gcloud run services update champions-worker --region=${_REGION} --update-env-vars=WORKER_BASE_URL=$${REAL_URL}
        fi
        printf '%s' "$${REAL_URL}" > /workspace/worker_url

  - id: deploy-server
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    secretEnv: ['BILLING_ACCOUNT']
    waitFor: ['deploy-worker']
    args:
      - -c
      - |
        set -eu
        WORKER_URL=$$(cat /workspace/worker_url)
        gcloud run deploy champions-server \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server:${SHORT_SHA} \
          --region=${_REGION} \
          --service-account=${_APP_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com \
          --no-allow-unauthenticated \
          --iap \
          --timeout=120 \
          --max-instances=10 \
          --set-env-vars="^##^GOOGLE_CLOUD_PROJECT=${PROJECT_ID}##FOLDER_PARENT=${_FOLDER_PARENT}##BILLING_ACCOUNT=$$BILLING_ACCOUNT##TASKS_LOCATION=${_TASKS_LOCATION}##TASKS_PROVISION_QUEUE=${_TASKS_PROVISION_QUEUE}##TASKS_SHUTDOWN_QUEUE=${_TASKS_SHUTDOWN_QUEUE}##WORKER_INVOKER_SERVICE_ACCOUNT=${_APP_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com##IAP_AUDIENCE=${_IAP_AUDIENCE_SERVER}##WORKER_BASE_URL=$${WORKER_URL}"

  - id: deploy-admin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    secretEnv: ['BILLING_ACCOUNT']
    waitFor: ['push-admin', 'deploy-worker']
    args:
      - -c
      - |
        set -eu
        WORKER_URL=$$(cat /workspace/worker_url)
        gcloud run deploy champions-admin \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/admin:${SHORT_SHA} \
          --region=${_REGION} \
          --service-account=${_APP_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com \
          --no-allow-unauthenticated \
          --iap \
          --timeout=300 \
          --max-instances=3 \
          --set-env-vars="^##^GOOGLE_CLOUD_PROJECT=${PROJECT_ID}##FOLDER_PARENT=${_FOLDER_PARENT}##BILLING_ACCOUNT=$$BILLING_ACCOUNT##IAP_AUDIENCE=${_IAP_AUDIENCE_ADMIN}##ADMIN_EMAILS=${_ADMIN_EMAILS}##TASKS_LOCATION=${_TASKS_LOCATION}##TASKS_PROVISION_QUEUE=${_TASKS_PROVISION_QUEUE}##TASKS_SHUTDOWN_QUEUE=${_TASKS_SHUTDOWN_QUEUE}##WORKER_INVOKER_SERVICE_ACCOUNT=${_APP_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com##WORKER_BASE_URL=$${WORKER_URL}"
